[preset.0]

name="Web Preview"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="structures/*.octa"
exclude_filter="tests/*,tools/*,docs/*,captures/*,preview/*,experiments/*,dist/*,build/*,assets/ui/prompts/*,assets/ui/*.json,assets/ui/button-chrome.png"
export_path="preview/index.html"
script_export_mode=1

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/canvas_resize_policy=0
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

[preset.1]

name="macOS"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter="structures/*.octa"
exclude_filter="tests/*,tools/*,docs/*,captures/*,preview/*,experiments/*,dist/*,build/*,assets/ui/prompts/*,assets/ui/*.json,assets/ui/button-chrome.png"
export_path="dist/Octa-macos.zip"
script_export_mode=1

[preset.1.options]

binary_format/architecture="universal"
application/bundle_identifier="com.makevoid.octa"
application/icon="res://assets/app-icon-macos.png"
application/signature="OCTA"
application/app_category="graphics-design"
application/short_version=""
application/version=""
application/copyright="Copyright (c) makevoid and Octa contributors"
codesign/codesign=1
codesign/entitlements/disable_library_validation=false
notarization/notarization=0
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false

[preset.2]

name="Linux x86_64"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter="structures/*.octa"
